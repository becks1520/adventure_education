<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game Edukasi 3D</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="card" id="hud-kontrol"></div>
        <div class="card" id="hud-status">
            <span id="hud-skor">⭐ 0</span>
            <span id="hud-koin">🪙 0</span>
            <span id="hud-gedung">🏫 0/0</span>
        </div>
        <button id="btn-menu" class="card tombol-menu" type="button" aria-label="Menu">☰</button>
    </div>
    <div id="menu-tombol">
        <button id="btn-misi" class="tombol-hud" type="button">📋 Misi</button>
        <button id="btn-karakter" class="tombol-hud" type="button">👕 Karakter</button>
        <button id="btn-unggah" class="tombol-hud" type="button">📥 Soal (unggah Excel)</button>
        <button id="btn-level" class="tombol-hud" type="button"></button>
        <button id="btn-suara" class="tombol-hud" type="button"></button>
        <button id="btn-titik" class="tombol-hud" type="button">📍 Kembali ke taman</button>
        <button id="btn-kamera" class="tombol-hud" type="button">🎥 Reset kamera (di belakang karakter)</button>
        <button id="btn-sistem" class="tombol-hud" type="button">⚙️ Pengaturan &amp; reset</button>
        <button id="btn-tentang" class="tombol-hud" type="button">ℹ️ Tentang</button>
    </div>

    <!-- Petunjuk saat dekat gedung (bisa diklik / diketuk) -->
    <button id="prompt-interaksi" class="card prompt-hidden" type="button"></button>

    <!-- Joystik bulat untuk layar sentuh (HP / tablet) -->
    <div id="joystick" aria-label="Joystik"><div id="joy-kenop"></div></div>

    <!-- Modal Kuis -->
    <div id="modal-kuis" class="modal-hidden" role="dialog" aria-modal="true" aria-labelledby="kuis-judul">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="kuis-judul">Kuis</h2>
                <button class="close-btn" id="btn-tutup" type="button" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <div id="kuis-soal">
                    <div class="progress-info">
                        <span id="kuis-progres-teks"></span>
                        <span id="kuis-skor-gedung"></span>
                    </div>
                    <div class="progress-bar"><div id="kuis-progres-bar"></div></div>
                    <p id="kuis-pertanyaan">Memuat pertanyaan...</p>
                    <div id="kuis-opsi" class="opsi-container"></div>
                    <div id="kuis-feedback" class="feedback-box"></div>
                    <button id="btn-lanjut" class="btn-aksi modal-hidden" type="button">Soal berikutnya ➜</button>
                </div>
                <div id="kuis-hasil" class="hasil-box modal-hidden">
                    <div id="hasil-bintang"></div>
                    <h3 id="hasil-judul"></h3>
                    <p id="hasil-teks"></p>
                    <div class="hasil-aksi">
                        <button id="btn-ulang" class="btn-aksi sekunder" type="button">Ulangi</button>
                        <button id="btn-selesai" class="btn-aksi" type="button">Kembali ke peta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pilih tingkat soal -->
    <div id="modal-level" class="modal-hidden" role="dialog" aria-modal="true" aria-labelledby="level-judul">
        <div class="modal-content">
            <div class="modal-header"><h2 id="level-judul">🎚️ Pilih tingkat soal</h2></div>
            <div class="modal-body">
                <p class="level-info">Soal menyesuaikan usia dan kemampuanmu. Bisa diganti kapan saja lewat tombol 🎚️.</p>
                <div id="level-opsi" class="opsi-container"></div>
            </div>
        </div>
    </div>

    <!-- Panel umum (misi & karakter) -->
    <div id="modal-panel" class="modal-hidden" role="dialog" aria-modal="true" aria-labelledby="panel-judul">
        <div class="modal-content">
            <div class="modal-header"><h2 id="panel-judul"></h2><button class="close-btn" id="panel-tutup" type="button" aria-label="Tutup">&times;</button></div>
            <div class="modal-body"><div id="panel-isi" class="opsi-container"></div></div>
        </div>
    </div>
    <div id="toast"></div>

    <!-- Pesan galat (mis. Three.js / WebGL gagal dimuat) -->
    <div id="kotak-error" class="modal-hidden"></div>
    <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;padding:24px;text-align:center">Game ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</div></noscript>

    <!-- Three.js: CDN utama -> CDN cadangan -> file lokal lib/three.min.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
    <script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>');</script>

    <!-- Pembaca Excel untuk menu Unggah Soal (opsional; tanpa ini tetap bisa CSV) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="data/soal.js?v=5"></script>
    <script src="main.js?v=5"></script>
</body>
</html>
